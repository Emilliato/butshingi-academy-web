name: Staging site (GitHub Pages)

# Publishes the Matric rewrite redesign to GitHub Pages for review.
# The live site (S3 + CloudFront) is deployed separately by deploy.yml from `main` only.
on:
  push:
    branches:
    - ccr-58bbf812-m0af1v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install
    - name: Build
      run: npm run build -- --base-href /${{ github.event.repository.name }}/
    - name: SPA fallback
      run: cp dist/butshingi-academy/browser/index.html dist/butshingi-academy/browser/404.html
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist/butshingi-academy/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
