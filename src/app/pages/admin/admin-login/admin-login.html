<section class="login">
  <div class="login-card">
    <a routerLink="/" class="login-brand">
      <span class="mark"><img src="images/logo.jpg" alt="S. Butshingi Academy logo" /></span>
      <span>S. Butshingi Academy</span>
    </a>
    <h1>Admin sign in</h1>
    <p>Staff access only. Manage news posts and review intake applications.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" class="input" formControlName="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" class="input" formControlName="password" autocomplete="current-password" />
      </div>

      @if (error()) {
        <p class="error login-error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <a routerLink="/" class="login-back">&larr; Back to the site</a>
  </div>
</section>
