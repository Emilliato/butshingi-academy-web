<div class="admin-header">
  <div>
    <h1>Tutorials</h1>
    <p>Video lessons and revision material shared with learners via Google Drive.</p>
  </div>
  <a class="btn btn--secondary btn--sm" [href]="driveFolderUrl" target="_blank" rel="noopener">
    Open in Google Drive ↗
  </a>
</div>

<div class="card tutorials__frame">
  <iframe
    [src]="embedUrl"
    title="S. Butshingi Academy tutorial videos"
    loading="lazy"
    allow="autoplay"
  ></iframe>
</div>

<p class="hint tutorials__hint">
  Can't see the videos above? The Drive folder must be shared as "Anyone with the link can
  view" for the embed to work —
  <a [href]="driveFolderUrl" target="_blank" rel="noopener">open the folder directly</a> to check
  or update sharing settings.
</p>
