<div class="floating-contact">
  @if (open()) {
    <div class="floating-contact__backdrop" (click)="close()"></div>
  }

  <div class="floating-contact__menu" [class.floating-contact__menu--open]="open()">
    <a
      class="floating-contact__item floating-contact__item--whatsapp"
      [href]="whatsappUrl"
      target="_blank"
      rel="noopener"
      (click)="close()"
      aria-label="Chat with us on WhatsApp"
    >
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M16.004 3C9.107 3 3.5 8.607 3.5 15.504c0 2.31.63 4.53 1.827 6.47L3 29l7.202-2.288a12.46 12.46 0 0 0 5.802 1.436h.005c6.897 0 12.504-5.607 12.504-12.504C28.513 8.747 22.9 3 16.004 3Zm0 22.87h-.004a10.35 10.35 0 0 1-5.278-1.446l-.379-.226-3.917 1.245 1.267-3.813-.247-.393a10.34 10.34 0 0 1-1.586-5.533c0-5.724 4.664-10.386 10.398-10.386 2.777 0 5.386 1.083 7.35 3.049a10.33 10.33 0 0 1 3.043 7.348c-.002 5.724-4.665 10.155-10.647 10.155Zm5.69-7.598c-.312-.156-1.844-.91-2.13-1.014-.286-.104-.494-.156-.702.156-.208.312-.806 1.014-.988 1.222-.182.208-.364.234-.676.078-.312-.156-1.317-.485-2.508-1.547-.927-.827-1.553-1.848-1.735-2.16-.182-.312-.02-.48.137-.636.14-.14.312-.364.468-.546.156-.182.208-.312.312-.52.104-.208.052-.39-.026-.546-.078-.156-.702-1.692-.962-2.318-.253-.607-.51-.525-.702-.535-.182-.008-.39-.01-.598-.01-.208 0-.546.078-.832.39-.286.312-1.09 1.066-1.09 2.6 0 1.535 1.117 3.018 1.273 3.226.156.208 2.198 3.356 5.325 4.706.744.321 1.325.513 1.778.657.747.238 1.427.204 1.964.124.599-.09 1.844-.754 2.104-1.482.26-.728.26-1.352.182-1.482-.078-.13-.286-.208-.598-.364Z"/>
      </svg>
    </a>

    <a
      class="floating-contact__item floating-contact__item--message"
      routerLink="/contact"
      (click)="close()"
      aria-label="Go to the contact form"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
      </svg>
    </a>
  </div>

  <button
    type="button"
    class="floating-contact__toggle"
    [class.floating-contact__toggle--open]="open()"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-label="Contact us"
  >
    <span class="floating-contact__bar floating-contact__bar--v"></span>
    <span class="floating-contact__bar floating-contact__bar--h"></span>
  </button>
</div>
